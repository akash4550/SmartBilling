# =============================================================================
# SmartBill V2 — Continuous Integration
#
# Triggered on every push to main and every pull request.
#
# Pipeline topology:
#   ┌───────────────────────────────────────────────────────────────┐
#   │  Services (network-separated, boot before job starts)         │
#   │    • postgres:15-alpine  (ledger; health-gated via pg_isready) │
#   │    • redis:7-alpine      (Upstash-compatible; TCP healthcheck) │
#   │                                                               │
#   │  Stages                                                        │
#   │    1. Checkout + Node 20 + npm cache                           │
#   │    2. prisma generate (before tsc — Prisma client is generated)│
#   │    3. Typecheck (tsc --noEmit) — FAST gate, fails fast         │
#   │    4. Lint (eslint via next lint)                              │
#   │    5. Prisma db push + RLS SQL + seed (provisions Postgres)    │
#   │    6. next build (production compilation; exercises env.ts)    │
#   │    7. Playwright install (browsers + deps, cached)             │
#   │    8. Next.js server started in background (port 3000)         │
#   │    9. Playwright E2E suite against the running app             │
#   │   10. Upload trace / screenshot / video artifacts on failure   │
#   └───────────────────────────────────────────────────────────────┘
#
# Notes:
#   • The Temporal workflow task queue is NOT backed by a Temporal server in
#     CI. The webhook route is exercised with x-test-bypass-hmac and the
#     legacy /api/cron/process-webhooks endpoint; the Temporal start path
#     is unit-covered elsewhere and typechecked. Adding temporalite as a
#     service is a follow-up when the worker bootstrap lands.
#   • Env vars are intentionally test-grade dummies. The env validator
#     (src/env.ts) requires well-formed values (sk_, whsec_, re_, URLs);
#     we supply syntactically valid placeholders so build/test don't
#     fail-fast on configuration before reaching the code under test.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref (saves CI minutes; PR re-push
# obsoletes the prior run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quality + E2E (single job; services are ephemeral per job so splitting
  # typecheck/lint/E2E into separate jobs would require re-provisioning the
  # DB each time and gives us almost no wall-clock win because typecheck
  # and lint finish in well under a minute).
  # ---------------------------------------------------------------------------
  test:
    name: Typecheck · Lint · Build · Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # --- Postgres 15 (matches docker-compose.yml; 17 is used in prod but
      #     the SQL features we rely on are all available in 15, and the
      #     alpine image is ~60MB which cuts spin-up time). ---
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smartbill
          POSTGRES_PASSWORD: smartbill
          POSTGRES_DB: smart_billing
        ports:
          - 5432:5432
        # Health-gated so steps run only once Postgres is accepting
        # connections; otherwise Prisma will race Postgres boot.
        options: >-
          --health-cmd "pg_isready -U smartbill -d smart_billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # --- Redis 7 (stand-in for Upstash; Redis-protocol compatible,
      #     which is all @upstash/redis's REST client needs to talk TCP
      #     in test — we override UPSTASH_REDIS_REST_URL to point at the
      #     local TCP Redis via a small HTTP proxy? No — simpler: we
      #     leave Upstash vars unset so read-model falls through to the
      #     Postgres path, which exercises the code we care about in
      #     E2E. Redis service is kept as a real cache target for
      #     future tests / the rate limiter. ---
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # ---- Core runtime ----
      NODE_ENV: test
      DATABASE_URL: postgresql://smartbill:smartbill@localhost:5432/smart_billing?schema=public
      # 32-byte hex = 64 chars, satisfies AUTH_SECRET min(32) refinement
      AUTH_SECRET: 7ad69f0b4c3e5d2a1f8b9c6d4e2a7f3b5c1d8e9f0a2b4c6d8e1f3a5b7c9d1e2f

      # ---- Upstash / Redis (unset → read-model transparently falls
      #      through to Postgres; Redis service is still available on
      #      6379 for any future ioredis/rate-limit TCP tests). ----
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""

      # ---- Stripe (syntactically valid placeholders; constructEvent is
      #      bypassed via x-test-bypass-hmac in the E2E spec). ----
      STRIPE_SECRET_KEY: sk_test_ci000000000000000000000000000000000
      STRIPE_WEBHOOK_SECRET: whsec_test000000000000000000000000000000000000000000

      # ---- Razorpay (placeholder shape) ----
      RAZORPAY_KEY_ID: rzp_test_ci000000000000
      RAZORPAY_KEY_SECRET: 000000000000000000000000000000000000000000
      RAZORPAY_WEBHOOK_SECRET: whsec_rzp_test0000000000000000000000000

      # ---- Email / Resend (placeholder; E2E does not assert on receipt
      #      delivery — the Resend SDK would fail to authenticate, so
      #      we rely on the applied_email_failed path which is already
      #      designed to be resilient to SMTP outages). ----
      RESEND_API_KEY: re_test_ci000000000000000000000000000000
      FROM_EMAIL: "SmartBill CI <ci@smartbill.test>"

      # ---- OpenAI (unused in E2E; set to empty so receipt-scan path
      #      returns null gracefully instead of throwing on bad key). ----
      OPENAI_API_KEY: ""

      # ---- Cron auth (real secret so timingSafeEqual has something to
      #      compare against in the cron route E2E calls). ----
      CRON_SECRET: ci-cron-secret-000000000000000000000000

      # ---- Temporal (unused in CI; the E2E spec hits the legacy cron
      #      endpoint. Values satisfy the regex validators.) ----
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: smartbill-webhooks

      # ---- Client-exposed ----
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci000000000000

      # ---- Playwright ----
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      # Turbopack is faster for dev, but build-then-start gives us a
      # production bundle in CI which is what we ship.
      PLAYWRIGHT_HTML_REPORT: playwright-report

    steps:
      # ---------------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2. Node toolchain — pinned to v20 with checksum validation, with
      #    npm cache primed across runs.
      # ---------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ---------------------------------------------------------------------
      # 3. Install — `npm ci` honors package-lock.json exactly; no drift,
      #    no surprise upgrades. --no-audit / --no-fund cut noise.
      # ---------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ---------------------------------------------------------------------
      # 4. Prisma client generation — required BEFORE tsc because generated
      #    types are imported throughout src/lib/prisma.ts.
      # ---------------------------------------------------------------------
      - name: Generate Prisma client
        run: npx prisma generate

      # ---------------------------------------------------------------------
      # 5. Typecheck — the fast gate. Runs against src/ only (Playwright
      #    spec has its own @playwright/test types which are intentionally
      #    not installed as a production dep; we exclude e2e/ from tsc).
      # ---------------------------------------------------------------------
      - name: Typecheck (tsc --noEmit)
        run: ./node_modules/.bin/tsc --noEmit

      # ---------------------------------------------------------------------
      # 6. Lint — eslint via `next lint` (picks up eslint-config-next).
      # ---------------------------------------------------------------------
      - name: Lint (next lint)
        run: npx next lint --max-warnings=0

      # ---------------------------------------------------------------------
      # 7. Provision Postgres schema + RLS + seed.
      #    db:setup runs, in order:
      #      prisma db push → prisma generate → rls-setup.sql →
      #      service-role.sql → ledger.sql → reconciler.sql → db:seed
      #    psql is preinstalled on ubuntu-latest.
      # ---------------------------------------------------------------------
      - name: Wait for Postgres (redundant with healthcheck, defensive)
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=smartbill psql -h localhost -U smartbill -d smart_billing -c "SELECT 1" >/dev/null 2>&1; then
              echo "Postgres ready";
              exit 0;
            fi
            echo "waiting for Postgres... ($i/30)"
            sleep 1
          done
          echo "Postgres never became ready"
          exit 1

      - name: Apply Prisma schema, RLS, and seed
        run: npm run db:setup
        env:
          # psql needs PGPASSWORD for the -f invocations inside db:setup.
          PGPASSWORD: smartbill
          ADMIN_EMAIL: admin@smartbill.com
          ADMIN_PASSWORD: password123

      # ---------------------------------------------------------------------
      # 8. Production build — exercises next build (RSC compilation, route
      #    tree shaking, env validation at build-time). This is the
      #    authoritative check; tsc alone doesn't catch App Router issues.
      # ---------------------------------------------------------------------
      - name: Build (next build)
        run: npm run build

      # ---------------------------------------------------------------------
      # 9. Install Playwright browsers (with OS deps). Cache the browser
      #    binaries between runs because downloading Chromium/WebKit/Firefox
      #    on every CI run adds ~90s.
      # ---------------------------------------------------------------------
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # 10. Start the Next.js production server in the background and
      #     wait until it responds on :3000 before handing off to Playwright.
      #     The server is started with & and we poll; no need for an
      #     external service container because we want the same build
      #     artifact we just produced.
      # ---------------------------------------------------------------------
      - name: Start Next.js server
        run: |
          npm run start > /tmp/next-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Next.js up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Next.js failed to start. Logs:"
          cat /tmp/next-server.log
          exit 1

      # ---------------------------------------------------------------------
      # 11. Playwright E2E — chromium only in CI (fastest); the spec is the
      #     ledger-admin focus-trap / optimistic-UI / webhook hydration
      #     suite that lives in e2e/ledger-admin.spec.ts. We DO NOT pass
      #     --retries because flaky tests are bugs, not CI noise.
      # ---------------------------------------------------------------------
      - name: Run Playwright E2E suite
        run: npx playwright test --project=chromium
        env:
          # The webhook E2E uses the legacy cron endpoint (no Temporal
          # worker in CI); CRON_SECRET is already set above to satisfy
          # timingSafeEqual.

      # ---------------------------------------------------------------------
      # 12. Artifacts — upload traces/screenshots/videos and the HTML
      #     report ONLY on failure so we can debug without rerunning
      #     locally. On success these directories are empty (no retries,
      #     no screenshot-on by default) so the upload is a no-op.
      # ---------------------------------------------------------------------
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Next.js server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-server-log
          path: /tmp/next-server.log
          retention-days: 7
          if-no-files-found: ignore
