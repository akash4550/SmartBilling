# =============================================================================
# Docker Compose — Smart Billing + PostgreSQL
#
# Usage:
#   1. Copy .env.example to .env and set OPENAI_API_KEY / POSTGRES_PASSWORD.
#   2. docker compose up --build
#   3. App will be available at http://localhost:3000
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: smart-billing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbill}
      POSTGRES_DB: ${POSTGRES_DB:-smart_billing}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbill} -d ${POSTGRES_DB:-smart_billing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    container_name: smart-billing-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=sk-dummy-test-key-1234567890
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=supersecretplaywrighttestkey123!
      - AUTH_SECRET=supersecretplaywrighttestkey123!
      - AUTH_TRUST_HOST=true
    ports:
      - "3000:3000"

volumes:
  postgres_data: